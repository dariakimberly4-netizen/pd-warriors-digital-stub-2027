<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123f31"><title>PD Warriors Digital Stub 2027</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#fbf7ec;color:#123f31}button,input{font:inherit}.app{min-height:100vh;padding:22px 14px}.head{text-align:center}.ey{font-size:10px;font-weight:900;letter-spacing:.13em;color:#9c2733}.head h1{font-size:26px;margin:6px 0 2px}.status{font-size:10px;font-weight:900}.orbit{position:relative;width:min(92vw,430px);height:min(102vw,470px);margin:24px auto}.center,.node{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:900;cursor:pointer}.center{width:min(38vw,174px);height:min(38vw,174px);left:50%;top:50%;transform:translate(-50%,-50%);border:0;background:#123f31;color:white;padding:16px;font-size:13px;box-shadow:0 12px 25px #123f3130}.node{width:min(23vw,106px);height:min(23vw,106px);border:2px solid #d2b15b;background:white;color:#123f31;padding:8px;font-size:10px;box-shadow:0 7px 18px #44371220}.n1{top:0;left:50%;transform:translateX(-50%)}.n2{top:20%;right:0}.n3{bottom:17%;right:0}.n4{bottom:0;left:50%;transform:translateX(-50%)}.n5{bottom:17%;left:0}.n6{top:20%;left:0}.panel{width:min(100%,600px);margin:18px auto;background:white;border:1px solid #e4d8b7;border-radius:18px;padding:18px;box-shadow:0 10px 25px #44371215}.hidden{display:none}.btn{border:0;border-radius:12px;padding:11px 14px;background:#123f31;color:white;font-weight:800;margin:3px}.gold{background:#a8832d}.red{background:#9c2733}.light{background:#f3eddf;color:#123f31}.field{width:100%;padding:12px;border:1px solid #d9ceb1;border-radius:11px;margin:8px 0}.person{padding:12px;border:1px solid #e4dbc4;border-radius:12px;margin:7px 0;cursor:pointer}.muted{font-size:12px;color:#70766f}.badge{display:inline-block;padding:5px 8px;border-radius:15px;background:#f3eddf;font-size:11px}.claims{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:15px 0}.claim{text-align:center;padding:12px 4px;border-radius:12px;background:#f6f0df;font-size:10px;font-weight:900}.claimed{background:#dceade}.toast{display:none;position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#123f31;color:#fff;padding:11px 16px;border-radius:20px;z-index:10}
</style></head><body><main class="app"><header class="head"><div class="ey">PARKINSON'S DISEASE WARRIORS PHILIPPINES</div><h1>GET TOGETHER 2027</h1><div class="status" id="net">● ONLINE</div></header><section id="home"><div class="orbit"><button class="center" onclick="openView('stubs')">DIGITAL<br>STUBS<br><small>PATIENT + COMPANIONS</small></button><button class="node n1" onclick="openView('scan')">SCAN QR</button><button class="node n2" onclick="openView('walkin')">REGISTER<br>WALK-IN</button><button class="node n3" onclick="openView('snack')">SNACK</button><button class="node n4" onclick="openView('lunch')">LUNCH</button><button class="node n5" onclick="openView('raffle')">RAFFLE</button><button class="node n6" onclick="openView('search')">SEARCH</button></div></section><section id="panel" class="panel hidden"><button class="btn light" onclick="back()">← ORBIT</button><div id="view"></div></section><div id="toast" class="toast"></div></main><script>
const K='pdw27_clean_attendees';const sample=[{id:'PDW27-0001',token:'A7X2K9Q1',name:'Juan Dela Cruz',type:'Patient'},{id:'PDW27-0002',token:'B8M4R2T6',name:'Maria Dela Cruz',type:'Companion'},{id:'PDW27-0003',token:'C3N7P5W8',name:'Pedro Santos',type:'Patient'}].map(x=>({...x,snack:false,lunch:false,raffle:false}));if(!localStorage.getItem(K))localStorage.setItem(K,JSON.stringify(sample));const get=()=>JSON.parse(localStorage.getItem(K)||'[]'),save=a=>localStorage.setItem(K,JSON.stringify(a));let mode='',selected='';
function openView(m){mode=m;home.classList.add('hidden');panel.classList.remove('hidden');render()}function back(){panel.classList.add('hidden');home.classList.remove('hidden')}function render(){if(mode==='walkin')view.innerHTML='<h2>Register Walk-In</h2><input id="nm" class="field" placeholder="Full name"><button class="btn" onclick="add()">CREATE STUB</button>';else if(mode==='scan')view.innerHTML='<h2>Scan QR</h2><p class="muted">Enter the attendee token for this clean test build.</p><input id="q" class="field" placeholder="QR token"><button class="btn" onclick="token()">OPEN STUB</button>';else{view.innerHTML='<h2>'+({stubs:'Digital Stubs',search:'Search Attendee',snack:'Snack Claim',lunch:'Lunch Claim',raffle:'Raffle Entry'}[mode]||'Attendees')+'</h2><input class="field" placeholder="Search name or attendee number" oninput="list(this.value)"><div id="list"></div>';list('')}}
function list(q){q=q.toLowerCase();document.getElementById('list').innerHTML=get().filter(x=>x.name.toLowerCase().includes(q)||x.id.toLowerCase().includes(q)).map(x=>'<div class="person" onclick="person(\''+x.id+'\')"><b>'+x.name+'</b><br><span class="muted">'+x.id+' • '+x.type+'</span></div>').join('')}function person(id){selected=id;let p=get().find(x=>x.id===id);view.innerHTML='<h2>'+p.name+'</h2><span class="badge">'+p.id+' • '+p.type+'</span><div class="claims"><div class="claim '+(p.snack?'claimed':'')+'">SNACK<br>'+(p.snack?'CLAIMED':'AVAILABLE')+'</div><div class="claim '+(p.lunch?'claimed':'')+'">LUNCH<br>'+(p.lunch?'CLAIMED':'AVAILABLE')+'</div><div class="claim '+(p.raffle?'claimed':'')+'">RAFFLE<br>'+(p.raffle?'ENTERED':'ELIGIBLE')+'</div></div><button class="btn" onclick="claim(\'snack\')">CLAIM SNACK</button><button class="btn gold" onclick="claim(\'lunch\')">CLAIM LUNCH</button><button class="btn red" onclick="claim(\'raffle\')">ENTER RAFFLE</button><p class="muted">QR token: '+p.token+'</p>'}function claim(k){let a=get(),p=a.find(x=>x.id===selected);if(p[k])return msg('Already processed');p[k]=true;save(a);person(p.id);msg('Saved on this phone')}function token(){let p=get().find(x=>x.token===q.value.trim()||x.id===q.value.trim());p?person(p.id):msg('Attendee not found')}function add(){let n=nm.value.trim();if(!n)return;let a=get(),i='PDW27-'+String(a.length+1).padStart(4,'0');a.push({id:i,token:crypto.randomUUID().slice(0,8).toUpperCase(),name:n,type:'Walk-In',snack:false,lunch:false,raffle:false});save(a);person(i)}function msg(s){toast.textContent=s;toast.style.display='block';setTimeout(()=>toast.style.display='none',1500)}function network(){net.textContent=navigator.onLine?'● ONLINE':'● OFFLINE • SAVED ON PHONE'}addEventListener('online',network);addEventListener('offline',network);network();
</script></body></html>
